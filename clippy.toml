allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Product names that may appear in docs without backticks (".." keeps defaults).
doc-valid-idents = ["DuckLake", "SlateDB", "DuckDB", "MinIO", "RustFS", "ClickBench", "ClickHouse", ".."]

# SlateDB 0.18 grew the state its handles carry, and the test suites' futures
# sit just past clippy's 16 KiB default; a quarter more is still a bound.
future-size-threshold = 24576
