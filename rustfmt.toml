# These options below are unstable: they take effect under
# `cargo +nightly-2026-08-29 fmt` and are silently ignored by stable rustfmt.
style_edition = "2024"
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
wrap_comments = true
comment_width = 80
format_code_in_doc_comments = true
