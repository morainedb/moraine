[package]
name = "moraine-fuzz"
version = "0.0.0"
publish = false
# Spelled out rather than inherited: the empty `[workspace]` below makes
# this its own root, so there is no outer workspace to inherit from.
edition = "2024"

# Its own workspace: the fuzz targets build against a nightly-only
# instrumentation runtime and are never part of the ordinary `--workspace`
# build, test, or lint pass.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
moraine = { path = "../crates/moraine", features = ["fuzzing"] }

# The crash-recovery target drives a real catalog over a store that stops
# writing partway through, so it needs a runtime and the object-store trait.
async-trait = "0.1"
futures = "0.3"
bytes = "1"
object_store = "0.14"
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "key_decode"
path = "fuzz_targets/key_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record_decode"
path = "fuzz_targets/record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crash_recovery"
path = "fuzz_targets/crash_recovery.rs"
test = false
doc = false
bench = false
