[workspace]
changelog_update = true
# Off while the workspace patches slatedb. The check builds each crate in a
# scratch project, which does not inherit `[patch.crates-io]` and so compiles
# against the published slatedb the patch exists to replace — it cannot pass,
# for a reason it is not reporting. Back on with publishing, when
# slatedb/slatedb#2080 is released.
semver_check = false

[[package]]
name = "moraine"
# Not published while the workspace patches slatedb; see the crate's
# `publish = false`. Releases still cut tags and a changelog, and the
# extension still ships.
publish = false
# What makes release-plz consider an unpublishable crate at all: the last
# released version is read off a git tag rather than the registry, which
# has stopped moving.
git_only = true
# The extension release references the released commit; the crate tag is fixed.
git_tag_name = "v{{ version }}"
# Single workspace changelog: moraine owns the one CHANGELOG.md at the repo root
# (changelog_path is relative to the root Cargo.toml) and folds moraine-duckdb's
# commits into it. The root file is not part of any crate's package tarball;
# crates.io renders the README, not the changelog, so nothing is lost there.
changelog_path = "CHANGELOG.md"
changelog_include = ["moraine-duckdb"]

[[package]]
name = "moraine-duckdb"
# Not published to crates.io (it ships as a prebuilt .duckdb_extension), but
# release-plz still tracks its changes so extension-only work bumps the shared
# workspace version and opens a release PR.
release = true
publish = false
# `git_only` is what makes release-plz consider an unpublishable crate at all:
# without it the crate is filtered out before any diff runs, and extension-only
# work never bumps the version. It reads the last released version off a git tag
# instead of the registry.
git_only = true
# Both crates share the workspace version, so moraine's `v<version>` tag already
# marks the commit this crate was last released at; reuse it rather than carrying
# a second tag that would always point at the same commit. The `ext-v<version>`
# tag is deliberately not used here: it is hand-dispatchable for binary rebuilds,
# so re-cutting one would move the diff baseline.
git_tag_name = "v{{ version }}"
# moraine creates that tag; without this release-plz would try to create it twice,
# once per crate. Reading it for the diff is independent of this setting.
git_tag_enable = false
# No GitHub release of its own: the crate's `v<version>` release and the
# separately built `ext-v<version>` release already cover it.
git_release_enable = false
# Its changes are folded into moraine's root changelog (changelog_include above),
# so it writes no changelog of its own.
changelog_update = false

[[package]]
name = "xtask"
release = false
publish = false
# Internal tooling: excluded from the published changelog entirely.
changelog_update = false
