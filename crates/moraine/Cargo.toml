[package]
name = "moraine"
description = "A SlateDB-backed catalog for DuckLake"
readme = "../../README.md"
keywords = ["duckdb", "ducklake", "slatedb", "catalog", "lakehouse"]
categories = ["database-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arrow = { workspace = true, features = ["ipc"] }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
prost = { workspace = true }
foyer = { workspace = true }
slatedb = { workspace = true }
slatedb-common = { workspace = true }
storekey = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Exposes crash-injection seams for the format-migration driver.
fault-injection = []
# Exposes the codec entry points the `fuzz/` targets drive.
fuzzing = []

[build-dependencies]
prost-build = { workspace = true }
protox = { workspace = true }

[dev-dependencies]
moraine = { path = ".", features = ["fault-injection"] }

object_store = { workspace = true, features = ["aws"] }
proptest = { workspace = true }
proptest-derive = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
