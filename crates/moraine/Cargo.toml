[package]
name = "moraine"
description = "A SlateDB-backed catalog for DuckLake"
readme = "../../README.md"
keywords = ["duckdb", "ducklake", "slatedb", "catalog", "lakehouse"]
categories = ["database-implementations"]
# Held back from crates.io while the workspace patches slatedb. A registry
# build resolves the published slatedb, which has neither the synchronous
# `begin` nor `DbReader::refresh()`, so the crate would not compile for
# anyone who installed it. Publishing resumes when slatedb/slatedb#2080 is
# released; 0.7.0 remains the newest version on the registry until then.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arrow = { workspace = true, features = ["ipc"] }
async-trait = { workspace = true }
bytes = { workspace = true }
fastbloom = { workspace = true }
futures = { workspace = true }
imbl = { workspace = true }
hashbrown = { workspace = true }
lru-slab = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
prost = { workspace = true }
roaring = { workspace = true }
serde = { workspace = true }
foyer = { workspace = true }
slatedb = { workspace = true }
slatedb-common = { workspace = true }
storekey = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[features]
# Exposes crash-injection seams for the format-migration driver.
fault-injection = []
# Exposes the codec entry points the `fuzz/` targets drive.
fuzzing = []

[build-dependencies]
prost-build = { workspace = true }
protox = { workspace = true }

[dev-dependencies]
dhat = { workspace = true }
cpu-time = { workspace = true }
stats_alloc = { workspace = true }
moraine = { path = ".", features = ["fault-injection"] }

object_store = { workspace = true, features = ["aws"] }
proptest = { workspace = true }
proptest-derive = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
