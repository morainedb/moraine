[package]
name = "moraine-duckdb"
description = "DuckDB extension exposing the moraine DuckLake catalog"
# Distributed as a prebuilt .duckdb_extension artifact, not a crate.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# A static library the DuckDB extension toolchain links into the loadable
# `.duckdb_extension` (the toolchain, not cargo, owns the final link). The
# rlib is for integration tests, which cannot link a staticlib; it adds an
# artifact and changes nothing the toolchain consumes.
crate-type = ["staticlib", "rlib"]

[dependencies]
arrow = { workspace = true, features = ["ffi", "ipc"] }
bytes = { workspace = true }
futures = { workspace = true }
moraine = { workspace = true, features = ["leader"] }
object_store = { workspace = true, features = ["aws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[lints]
workspace = true
