[package]
name = "moraine-duckdb"
description = "DuckDB extension exposing the moraine DuckLake catalog"
# Distributed as a prebuilt .duckdb_extension artifact, not a crate.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# A static library the DuckDB extension toolchain links into the loadable
# `.duckdb_extension` (the toolchain, not cargo, owns the final link). The
# rlib is for integration tests, which cannot link a staticlib; it adds an
# artifact and changes nothing the toolchain consumes.
crate-type = ["staticlib", "rlib"]

[dependencies]
async-trait = { workspace = true }
arrow = { workspace = true, features = ["ffi", "ipc"] }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
moraine = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The browser build has no socket or TLS stack: the S3 client runs over an
# HTTP connector the host supplies, so only the request logic is linked.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
object_store = { workspace = true, features = ["aws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }

# A browser has no threads: the runtime is single-threaded and runs only
# while the host is inside a call.
[target.'cfg(target_os = "emscripten")'.dependencies]
object_store = { workspace = true, features = ["aws-base"] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[build-dependencies]
cbindgen = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
parquet = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
