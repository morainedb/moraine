[graph]
all-features = true

[licenses]
# Add specific SPDX ids here as dependencies demand them; unused allowances
# fail the check, so this list always reflects the real graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # slatedb's transitive graph (aws-lc, foyer, webpki-roots):
    "ISC",
    "Zlib",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    # arrow's transitive graph (tiny-keccak) — public-domain dedication:
    "CC0-1.0",
    # cbindgen (ABI generation) and imbl (persistent catalog maps):
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
ignore = [
    # Transitive via slatedb -> foyer (cache); nothing we can change here.
    # Revisit on slatedb bumps.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via slatedb->foyer" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via slatedb->foyer" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; transitive via slatedb->figment->serde_yaml" },
    # zstd's fixes land on 0.14/8.x only, and foyer 0.22.6 — the newest, and
    # the one slatedb pins — is on 0.13/7.x, whose last releases are 0.13.3
    # and 7.3.0. What it compresses is its own cache entries in one process:
    # no seekable or legacy frames, and no stream from anywhere else.
    # Revisit on foyer bumps.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 context reuse; transitive via slatedb->foyer, unpatched on 0.13" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.x Seekable::decompress; transitive via slatedb->foyer, unpatched on 7.x" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.x legacy-frame decompression; transitive via slatedb->foyer, unpatched on 7.x" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# `DbReader::refresh()` — slatedb/slatedb#2080, open upstream and carried
# from the author's fork until it lands. Drops with the patch in the
# workspace manifest.
allow-git = ["https://github.com/phytal/slatedb"]
