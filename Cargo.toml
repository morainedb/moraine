[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexpropp/moraine"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
fastbloom = "0.17"
arrow = { version = "60.0.0", default-features = false }
async-trait = "0.1"
bytes = "1"
cpu-time = "1"
dhat = "0.3"
futures = { version = "0.3", default-features = false, features = ["std"] }
# Diff iterator misses updates past a shared leaf before 7.0.2; regression pinned in commit/diff.rs.
imbl = "7.0.2"
hashbrown = { version = "0.17.1", default-features = false }
lru-slab = "0.1.2"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "async", "snap", "zstd"] }
moraine = { path = "crates/moraine", version = "0.8.2" }
# 0.22.6 is the floor slatedb pins, and it is what sets the workspace MSRV.
foyer = { version = "0.22.6", features = ["serde"] }
object_store = "0.14"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
proptest = "1"
proptest-derive = "0.9"
roaring = "0.11"
rustix = { version = "1", default-features = false, features = ["process", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slatedb = "0.17.0"
# must move in lockstep with slatedb: it is where the metrics traits live
slatedb-common = "0.17.0"
storekey = "0.11"
stats_alloc = "0.1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
uuid = { version = "1", features = ["v4", "v5"] }
cbindgen = { version = "0.29", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"


[profile.release]
# Deliberately carries no debug info. A build that can name the innermost
# frames of a production stall comes from `.github/workflows/debug-build.yml`,
# which sets `CARGO_PROFILE_RELEASE_DEBUG` for that run alone.

[profile.dev]
opt-level = 0
debug = "line-tables-only" # Shrinks target folder size dramatically
split-debuginfo = "unpacked" # Keeps debug data separate from binaries

[profile.dev.package."*"]
opt-level = 3 # Compiles dependencies with high optimization once

# `DbReader::refresh()` — slatedb/slatedb#2080, open upstream and carried
# here until it lands. The committer's reads need the reader to refresh
# when they ask, not at its next tick; without it a read can only set a
# flag the poller reads later. Both crates come from one revision: the
# metrics traits in `slatedb-common` must be the ones `slatedb` was built
# against.
[patch.crates-io]
slatedb = { git = "https://github.com/phytal/slatedb", rev = "9717227cc4c17bcf2c07ae096286ca5b76ee9683" }
slatedb-common = { git = "https://github.com/phytal/slatedb", rev = "9717227cc4c17bcf2c07ae096286ca5b76ee9683" }
