version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The reusable-workflow ref mirrors the primary DuckDB pin in
      # .github/duckdb-versions; it is not an independent dependency.
      - dependency-name: "duckdb/extension-ci-tools/*"
