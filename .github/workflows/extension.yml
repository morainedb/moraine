name: Extension
# Build the extension for every published platform and prove the bundled
# DuckLake in the same container that built it.
#
# Publishing is absent on purpose: the primary pin in
# .github/duckdb-versions is a development revision of DuckDB, and a
# C++-ABI extension only loads into the exact version stamped in its
# footer — so there is no DuckDB anyone could load a published build into.
# The ext-v* release job returns with the first tagged DuckDB 2.0.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build the extension (extension-ci-tools)
    # `duckdb_version` is omitted, so the build takes the `duckdb`
    # submodule as checked out — the commit .github/duckdb-versions pins,
    # which has no release to check out by tag. `duckdb_tag` stamps the
    # version string that submodule's build reports, and `ci_tools_version`
    # names this same ref: it decides which distribution matrix the build
    # is generated from, and a matrix from another ref omits fields this
    # one's jobs read. `cargo xtask check-pins` enforces both.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@969bc76276acec1c0a3922ff500d2ec3a1a3b037
    with:
      extension_name: moraine
      ci_tools_version: 969bc76276acec1c0a3922ff500d2ec3a1a3b037
      duckdb_tag: v2.0.0-dev0
      enable_rust: true
      # moraine's Rust core (tokio, object_store, SlateDB) does not target
      # WebAssembly, and Windows is unverified; the community build excludes
      # the same set.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"
      # The bundled DuckLake carries the patch series: prove the build
      # records row-ID statistics, prunes a scan by row id, and takes
      # existing delete positions. It runs here rather than in a job of its
      # own because the only CLI that can load the artifact is the one this
      # container just built beside it.
      post_build_command: >-
        cargo run -q -p xtask -- validate-release-artifact v2.0.0-dev0
        build/release/extension/moraine/moraine.duckdb_extension
      # Point ccache at the directory the Linux container already mounts and
      # caches; without it every build recompiles DuckDB from scratch.
      test_config: '{"test_env_variables": {"CCACHE_DIR": "/ccache_dir"}}'
