name: Extension
# Build and validate every supported platform, then publish an unsigned ext-v* release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extension release tag, e.g. ext-v0.7.0 or ext-v0.7.0-build.2"
        required: true
        type: string

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^ext-v[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]+)?$ ]]; then
            echo "Expected ext-v<version> or ext-v<version>-build.<number>" >&2
            exit 1
          fi

  build:
    name: Build the extension (extension-ci-tools)
    needs: validate-tag
    # duckdb_version checks DuckDB out at that release and stamps every
    # version string from it; ci_tools_version must match the ref above.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@78bd1e4abbd543822166d5b07644751ba1fc6e8d
    with:
      extension_name: moraine
      ci_tools_version: 78bd1e4abbd543822166d5b07644751ba1fc6e8d
      duckdb_version: v2.0.0
      enable_rust: true
      # moraine's Rust core (tokio, object_store, SlateDB) does not target
      # WebAssembly, and Windows is unverified; the community build excludes
      # the same set.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"
      # Point ccache at the directory the Linux container already mounts and
      # caches; without it every build recompiles DuckDB from scratch.
      test_config: '{"test_env_variables": {"CCACHE_DIR": "/ccache_dir"}}'

  validate:
    needs: build
    uses: ./.github/workflows/validate-extension.yml

  release:
    needs: [build, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: ./.github/actions/publish-extension-release
        with:
          tag: ${{ inputs.tag }}
          target: ${{ github.sha }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
