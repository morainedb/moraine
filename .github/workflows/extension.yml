name: Extension
# Build the extension for every supported DuckDB release × platform and
# publish an UNSIGNED ext-v* release from a dispatched tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extension release tag, e.g. ext-v0.1.0 or ext-v0.1.0-build.2"
        required: true

jobs:
  # A C++-ABI extension only loads into the exact DuckDB version stamped in
  # its footer, so every supported release gets its own build. The list lives
  # in .github/duckdb-versions; `cargo xtask check-pins` keeps it and every
  # other mention of a version in step.
  versions:
    name: Read the DuckDB version matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "matrix=$(cargo run -q -p xtask -- version-matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.duckdb_version }} (extension-ci-tools)
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        duckdb_version: ${{ fromJson(needs.versions.outputs.matrix) }}
    # Pinned to the primary release; `duckdb_version`, not this ref, selects
    # which DuckDB each matrix entry checks out. `ci_tools_version` names the
    # same ref for the reason release.yml gives: a matrix generated from an
    # older ref silently drops the platforms its config cannot describe.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      extension_name: moraine
      duckdb_version: ${{ matrix.duckdb_version }}
      ci_tools_version: v1.5.5
      enable_rust: true
      # moraine's Rust core (tokio, object_store, SlateDB) does not target
      # WebAssembly, and Windows is unverified; the community build excludes
      # the same set.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"
      # Point ccache at the directory the Linux container already mounts and
      # caches; without it every build recompiles DuckDB from scratch. See
      # release.yml, which passes the same thing for the same reason.
      test_config: '{"test_env_variables": {"CCACHE_DIR": "/ccache_dir"}}'

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: ./.github/actions/publish-extension-release
        with:
          tag: ${{ inputs.tag }}
          target: ${{ github.sha }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
