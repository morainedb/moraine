name: Release
# On push to main, when Cargo.toml's version isn't on crates.io yet: build the
# extension for every platform, and only if that succeeds, publish the crate
# and cut the v<version> crate release.
#
# The ext-v<version> extension release carries the per-platform binaries.
# It came off while DuckDB 2.0 had no tag, when no released DuckDB
# reported the version string a build of the pin carried; 2.0.0 tags and
# publishes, so a build loads into a stock CLI again.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Both gates on one runner and one checkout: the matrix is only ever read
  # when a release is happening, and a second job for it would put another
  # runner start and another `cargo run` ahead of a half-hour build.
  should-release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # The workspace version (inherited by the moraine crate) lives in the
        # root Cargo.toml. Release when crates.io doesn't have it yet; a missing
        # crate (404 from the index) also means "release".
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          index=$(mktemp)
          trap 'rm -f "$index"' EXIT
          status=$(curl -sS --retry 3 --connect-timeout 10 --max-time 60 \
            -H "User-Agent: moraine-release (alex@contour.app)" \
            -o "$index" -w '%{http_code}' https://index.crates.io/mo/ra/moraine)
          case "$status" in
            200) jq -e -s 'length > 0 and all(.[]; (.vers | type) == "string")' "$index" > /dev/null ;;
            404) ;;
            *) echo "crates.io lookup failed (HTTP $status)" >&2; exit 1 ;;
          esac
          if [ "$status" = 200 ] && jq -e -s --arg version "$version" \
               'any(.[]; .vers == $version)' "$index" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "moraine $version already on crates.io - nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "moraine $version not on crates.io - release pending."
          fi
  ci:
    needs: should-release
    if: needs.should-release.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build-extension:
    needs: should-release
    if: needs.should-release.outputs.release == 'true'
    # Omit duckdb_version to build the pinned submodule. The Makefile stamps
    # duckdb_tag explicitly; test_config forwards it into Linux containers.
    # ci_tools_version must match the reusable workflow's ref.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@78bd1e4abbd543822166d5b07644751ba1fc6e8d
    with:
      extension_name: moraine
      ci_tools_version: 78bd1e4abbd543822166d5b07644751ba1fc6e8d
      duckdb_tag: v2.0.0
      enable_rust: true
      # moraine's Rust core (tokio, object_store, SlateDB) does not target
      # WebAssembly, and Windows is unverified; the community build excludes
      # the same set.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"
      # The bundled DuckLake carries the patch series: prove the build
      # records row-ID statistics, prunes a scan by row id, and takes
      # existing delete positions. It runs here rather than in a job of its
      # own because the only CLI that can load the artifact is the one this
      # container just built beside it.
      post_build_command: >-
        cargo run -q -p xtask -- validate-release-artifact v2.0.0
        build/release/extension/moraine/moraine.duckdb_extension
      # The Linux builds run in a container with a ccache directory mounted
      # at /ccache_dir and cached between runs, but nothing points ccache at
      # it, so every release recompiles DuckDB from scratch into a cache
      # that dies with the container. `test_env_variables` is appended to
      # the env file that same container is built with, which is the one
      # hook this workflow gives us to set it.
      test_config: '{"test_env_variables": {"CCACHE_DIR": "/ccache_dir", "DUCKDB_TAG": "v2.0.0"}}'

  publish:
    needs: [should-release, build-extension, ci]
    if: needs.should-release.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Bounded rather than left to hold a runner in silence: the releases
    # API has hung indefinitely on uploads it usually moves in seconds.
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.should-release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Authenticate git so release-plz can push the tag
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.RELEASE_PLZ_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"
      - name: Publish crate and create the v<version> release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish the ext-v<version> extension release
        uses: ./.github/actions/publish-extension-release
        with:
          tag: ext-v${{ env.VERSION }}
          target: ${{ github.sha }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
