name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/rfcs/**', 'CHANGELOG.md', 'ROADMAP.md']
  pull_request:
    paths: ['site/**', 'docs/rfcs/**', 'CHANGELOG.md', 'ROADMAP.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the releases page reads each release tag's source for
      # the store-format and catalog-version constants it declares.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      # The releases page lists each extension release's binaries from the
      # GitHub API; the token keeps the build off the anonymous rate limit.
      - run: npm run build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The org root site (morainedb.github.io) can only be served from the
      # repository of that name, so the built site is pushed there; Pages in
      # that repository deploys the gh-pages branch.
      - name: Publish to morainedb.github.io
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: morainedb/morainedb.github.io
          publish_branch: gh-pages
          publish_dir: site/dist
          force_orphan: true
