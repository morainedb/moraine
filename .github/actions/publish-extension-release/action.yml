name: Publish extension release
description: Attach built per-DuckDB-version, per-arch extensions to a draft ext-v* release once every supported combination is present, reveal it, and pin the descriptor ref.
inputs:
  tag:
    description: The ext-v<version>[-build.N] release/tag name.
    required: true
  target:
    description: Commit SHA the tag points at.
    required: true
  token:
    description: Token with contents:write (release + push to main).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Stage per-version, per-arch assets
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        shopt -s nullglob
        for d in artifacts/moraine-*-extension-*/; do
          name=${d%/}
          name=${name##*/}
          arch=${name##*-extension-}
          duckdb_version=${name#moraine-}
          duckdb_version=${duckdb_version%-extension-*}
          cp "$d/moraine.duckdb_extension" \
             "dist/moraine.${duckdb_version}.${arch}.duckdb_extension"
        done
        ls -l dist
    # The last check that a release is whole, and the only one that says
    # which build is missing: a leg the upstream matrix never starts leaves
    # no job and no annotation behind to name.
    - name: Require a build for every supported version on every platform
      shell: bash
      run: cargo run -q -p xtask -- check-release-assets dist
    - name: Create draft release, attach binaries, reveal
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        versions=$(ls dist \
          | sed -E 's/^moraine\.(v[0-9.]+)\..*/\1/' | sort -u | paste -sd', ' -)
        gh release create "${{ inputs.tag }}" --target "${{ inputs.target }}" --draft \
          --title "${{ inputs.tag }}" \
          --notes "Unsigned moraine extension, built for DuckDB ${versions}. Assets are named moraine.<duckdb-version>.<platform>.duckdb_extension; a build only loads into the DuckDB version it names, and needs a CLI started with -unsigned. Signed install (no flags, any supported version): INSTALL moraine FROM community; LOAD moraine;" \
          || true
        # The upload has hung indefinitely against the releases API on a
        # payload it usually moves in under a minute, leaving a draft that
        # never reveals and a job with nothing to read. Each attempt is
        # bounded and retried; `--clobber` makes a partial upload safe to
        # repeat, so a retry costs transfer rather than correctness.
        uploaded=false
        for attempt in 1 2 3; do
          if timeout 600 gh release upload "${{ inputs.tag }}" \
               dist/*.duckdb_extension --clobber; then
            uploaded=true
            break
          fi
          echo "release upload attempt ${attempt} did not finish; retrying" >&2
          sleep $((attempt * 15))
        done
        if [ "$uploaded" != true ]; then
          echo "release upload did not finish in three bounded attempts" >&2
          exit 1
        fi
        timeout 120 gh release edit "${{ inputs.tag }}" --draft=false
    - name: Pin descriptor ref to the released commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        python3 - "${{ inputs.target }}" <<'PY'
        import re, sys, pathlib
        sha = sys.argv[1]
        p = pathlib.Path("description.yml")
        p.write_text(re.sub(r'(?m)^(\s*ref:\s*).*$', r'\g<1>' + sha, p.read_text(), count=1))
        PY
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if ! git diff --quiet -- description.yml; then
          git add description.yml
          git commit -m "docs: pin community descriptor ref to ${{ inputs.tag }} [skip ci]"
          git push origin HEAD:main
        fi
