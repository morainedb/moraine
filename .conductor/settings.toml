"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Every workspace gets the repo's git hooks. They shell out to cargo, and
# hooks run in non-interactive shells that never source a profile, so the
# toolchain has to be installed and on the default PATH before they fire.
[scripts]
setup = '''
set -e

# DuckLake's Linux extension pipeline uses GCC 14. Match it here so the
# extension shim and downstream patch exercise the same corrected C++11
# implicit-move behavior as the published build.
if [ "$(uname -s)" = "Linux" ] && command -v dnf >/dev/null 2>&1; then
  if ! command -v gcc14-gcc >/dev/null 2>&1 || ! command -v gcc14-g++ >/dev/null 2>&1; then
    sudo dnf install -y gcc14 gcc14-c++
  fi

  # `cargo xtask e2e` drives DuckDB's own cmake build, which generates
  # Ninja. Amazon Linux ships neither.
  if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
    sudo dnf install -y cmake ninja-build
  fi

  # The bundled DuckLake resolves its roaring dependency through vcpkg,
  # whose compiler probe configures with no explicit compiler set. GCC 14 under
  # its prefixed name does not answer to `c++`, so without an unprefixed
  # one that probe fails and takes the whole e2e build with it.
  command -v c++ >/dev/null 2>&1 || sudo dnf install -y gcc-c++
fi

# Install Rust and a C compiler when the workspace starts without them.
if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
  curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
  command -v cc >/dev/null 2>&1 || sudo dnf install -y gcc
fi

# `~/.cargo/bin` is reached through a shell profile, which a hook never
# reads. Symlink into a directory the default PATH already covers.
if ! command -v cargo >/dev/null 2>&1 && [ -d "$HOME/.cargo/bin" ]; then
  for tool in "$HOME"/.cargo/bin/*; do
    sudo ln -sf "$tool" "/usr/local/bin/$(basename "$tool")"
  done
fi

# Install both pinned toolchains before the first commit invokes the hooks.
rustup toolchain install nightly-2026-08-29 --profile minimal --component rustfmt
cargo --version >/dev/null

# The commit hook uses the same pinned C/C++ formatter as CI.
python3 -m venv target/clang-tools
target/clang-tools/bin/python -m pip install \
  "clang-format==$(cat .clang-tools-version)" \
  "clang-tidy==$(cat .clang-tools-version)"

# `cargo xtask e2e` compiles DuckDB itself, and every workspace builds it
# in its own tree, so without a compiler cache each one pays ten minutes
# for the same objects. DuckDB's cmake routes compiles through ccache or
# sccache whenever it finds one on PATH, which takes that to about one
# minute. On a Mac the cache sits under $HOME, so every workspace on the
# machine reads what the first one built.
#
# Not fatal if it fails: a workspace without a compiler cache builds
# slowly, which beats one that refused to be created. Branching on the
# host OS rather than CONDUCTOR_IS_LOCAL — installing a Linux binary on a
# developer's Mac is the one outcome worth ruling out structurally.
if ! command -v ccache >/dev/null 2>&1 && ! command -v sccache >/dev/null 2>&1; then
  if [ "$(uname -s)" = "Darwin" ]; then
    command -v brew >/dev/null 2>&1 && brew install ccache || true
  else
    # Amazon Linux packages neither, and sccache ships a static binary.
    # Bumping this pin only changes how fast a fresh workspace builds.
    sccache_version=v0.10.0
    case "$(uname -m)" in
      aarch64) sccache_target=aarch64-unknown-linux-musl ;;
      *)       sccache_target=x86_64-unknown-linux-musl ;;
    esac
    sccache_archive="sccache-$sccache_version-$sccache_target"
    if curl -sSfL --retry 3 \
         "https://github.com/mozilla/sccache/releases/download/$sccache_version/$sccache_archive.tar.gz" \
         | tar xz -C /tmp; then
      sudo install -m755 "/tmp/$sccache_archive/sccache" /usr/local/bin/sccache
      # A cloud workspace's disk also holds the cargo target directory, so
      # cap the cache rather than let it grow into the default 10G.
      mkdir -p "$HOME/.config/sccache"
      printf '[cache.disk]\nsize = %d\n' $((2 * 1024 * 1024 * 1024)) \
        > "$HOME/.config/sccache/config"
    fi
  fi
fi

# The Rust half of the same problem: every workspace compiles the same
# dependency graph in its own worktree. mbx keys each compiler output on its
# inputs in one store under $HOME, so the second workspace restores what the
# first compiled, and it moves `target/` into that store, where collection
# holds every worktree's build output to one budget. CI caches through the
# same tool.
#
# Not fatal if it fails, and not installed over an existing mbx. Bumping the
# pin only changes how fast a workspace builds.
mbx_version=v1.29.2
mbx_bin="$HOME/.local/bin"
if ! command -v mbx >/dev/null 2>&1 && [ ! -x "$mbx_bin/mbx" ]; then
  case "$(uname -s)-$(uname -m)" in
    Darwin-*)      mbx_target=aarch64-apple-darwin ;;
    Linux-aarch64) mbx_target=aarch64-unknown-linux-musl ;;
    *)             mbx_target=x86_64-unknown-linux-musl ;;
  esac
  mbx_archive="mbx-$mbx_target.tar.gz"
  mbx_release="https://github.com/jdx/mr-boxington/releases/download/$mbx_version"
  mbx_staging=$(mktemp -d)

  # The release publishes SHA256SUMS beside the archives; Amazon Linux has
  # `sha256sum` and a Mac has `shasum`.
  mbx_verify() {
    if command -v sha256sum >/dev/null 2>&1; then
      sha256sum --check --strict -
    else
      shasum -a 256 --check --strict -
    fi
  }
  if curl -sSfL --retry 3 -o "$mbx_staging/$mbx_archive" "$mbx_release/$mbx_archive" &&
     curl -sSfL --retry 3 -o "$mbx_staging/SHA256SUMS" "$mbx_release/SHA256SUMS" &&
     (cd "$mbx_staging" && grep "  $mbx_archive\$" SHA256SUMS | mbx_verify); then
    mkdir -p "$mbx_bin"
    tar -xzf "$mbx_staging/$mbx_archive" -C "$mbx_bin" mbx
  fi
  rm -rf "$mbx_staging"
fi

PATH="$mbx_bin:$PATH"
if command -v mbx >/dev/null 2>&1; then
  mbx_executable=$(command -v mbx)

  # Same reasoning as the toolchain above: a hook reads no profile, so mbx
  # has to answer from the default PATH.
  if [ "$(uname -s)" = "Linux" ] && [ "$mbx_executable" != /usr/local/bin/mbx ]; then
    sudo ln -sf "$mbx_executable" /usr/local/bin/mbx || true
  fi

  # Installs the Cargo shim and points rust-analyzer's background check at
  # it. It prints the PATH line that sends a Mac shell's plain `cargo`
  # through mbx too; it never edits a startup file.
  mbx setup || true

  # A cloud workspace is this checkout's whole machine, so plain `cargo` can
  # go through the shim there without touching a developer's own Rust setup:
  # a wrapper ahead of rustup on the PATH the agent and terminals use, which
  # names the real Cargo because mbx otherwise selects the wrapper again.
  if [ "$CONDUCTOR_IS_LOCAL" = "0" ] && [ -x "$HOME/.cargo/bin/cargo" ]; then
    mbx_shim="${XDG_DATA_HOME:-$HOME/.local/share}/mbx/bin/cargo"
    if [ -x "$mbx_shim" ]; then
      printf '#!/bin/sh\nexport CARGO="%s"\nexec "%s" "$@"\n' \
        "$HOME/.cargo/bin/cargo" "$mbx_shim" > "$mbx_bin/cargo"
      chmod +x "$mbx_bin/cargo"
    fi
  fi
fi

git config core.hooksPath .githooks

# `cargo xtask check-pins` and `cargo xtask e2e` both read the `duckdb` and
# `extension-ci-tools` submodules, which a fresh clone leaves empty.
# Shallow, because nothing reads their history — only the pinned commits.
# Not fatal: a workspace that cannot yet run e2e still beats one that
# refused to be created, and check-pins names the checkout that repairs it.
git submodule update --init --depth 1 || git submodule update --init || true
'''
